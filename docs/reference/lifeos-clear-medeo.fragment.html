        state.editTriggerId = null;
        if (restoreFocus && id) {
          const trigger = id === "add-food" ? root.querySelector('[data-action="add-food"]') : root.querySelector('[data-action="edit-food"][data-food-id="' + id + '"]');
          if (trigger) trigger.focus();
        }
      }
      function setView(view) {
        if (["today", "nutrition", "finance", "gym"].indexOf(view) < 0) return;
        state.view = view;
        if (view === "gym" && state.gymMode === "exercise") state.gymMode = "overview";
        render();
        persistState();
      }
      function completeSet() {
        const exercise = currentPlanExercise();
        const sets = exerciseLogs(exercise.id);
        const active = activeSetIndex(sets);
        if (active < 0) return;
        const weightInput = root.querySelector("#active-weight");
        const repsInput = root.querySelector("#active-reps");
        if (!weightInput || !repsInput || !weightInput.reportValidity() || !repsInput.reportValidity()) return;
        const weight = Number(weightInput.value);
        const reps = Number(repsInput.value);
        if (!Number.isFinite(weight) || !Number.isFinite(reps) || weight < 0 || reps < 1) return;
        sets[active] = { weight: weight, reps: Math.round(reps), done: true };
        const next = activeSetIndex(sets);
        render();
        announce(next < 0 ? "Упражнение завершено." : "Подход записан. Теперь подход " + (next + 1) + ".");
        persistState();
        const nextInput = root.querySelector("#active-weight");
        if (nextInput) nextInput.focus();
      }
      function updateTimerUi() {
        const clock = root.querySelector("#rest-clock");
        const toggle = root.querySelector('[data-action="toggle-rest"]');
        const status = root.querySelector("#rest-status");
        if (clock) clock.textContent = formatTime(state.restRemaining);
        if (toggle) toggle.textContent = state.restRunning ? "Остановить" : "Старт";
        if (status) status.textContent = state.restRunning ? "идёт отдых" : "короткий таймер · 90 секунд";
      }
      function toggleRest() {
        if (state.restRunning) {
          window.clearInterval(restInterval);
          restInterval = 0;
          state.restRunning = false;
          announce("Таймер отдыха остановлен.");
        } else {
          if (state.restRemaining <= 0) state.restRemaining = 90;
          state.restRunning = true;
          restInterval = window.setInterval(function () {
            if (!root.isConnected) {
              window.clearInterval(restInterval);
              restInterval = 0;
              return;
            }
            state.restRemaining = Math.max(0, state.restRemaining - 1);
            updateTimerUi();
            if (state.restRemaining === 0) {
              window.clearInterval(restInterval);
              restInterval = 0;
              state.restRunning = false;
              updateTimerUi();
              announce("Время отдыха вышло.");
            }
          }, 1000);
          announce("Таймер отдыха запущен на 90 секунд.");
        }
        updateTimerUi();
      }

      const useRefraction = (function () {
        if (window.__LG_FORCE_FALLBACK__) return false;
        const ua = window.navigator && window.navigator.userAgent ? window.navigator.userAgent : "";
        if (/\b(Firefox|FxiOS|CriOS|EdgiOS|OPiOS)\//i.test(ua)) return false;
        if (/Safari\//i.test(ua) && /AppleWebKit\//i.test(ua) && !/\b(Chrome|HeadlessChrome|Chromium|Edg|OPR|SamsungBrowser)\//i.test(ua)) return false;
        try {
          const css = window.CSS;
          const filterValue = 'url("#lifeos-filter-probe")';
          if (css && css.supports && !css.supports("backdrop-filter", filterValue) && !css.supports("-webkit-backdrop-filter", filterValue)) return false;
          const probe = document.createElement("div");
          probe.style.backdropFilter = filterValue;
          probe.style.webkitBackdropFilter = filterValue;
          return probe.style.backdropFilter !== "" || probe.style.webkitBackdropFilter !== "";
        } catch (error) {
          return false;
        }
      })();

      function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
      function smoothStep(edge0, edge1, value) {
        const t = clamp((value - edge0) / (edge1 - edge0 || 1), 0, 1);
        return t * t * (3 - 2 * t);
      }
      function profileCurve(value, profile) {
        const eased = smoothStep(0, 1, value);
        if (profile === "soft") return eased * .78;
        if (profile === "prominent") return Math.pow(eased, .72);
        if (profile === "thin") return Math.pow(eased, 1.45);
        return eased;
      }
      function roundedRectSdf(px, py, width, height, radius) {
        const cx = px - width / 2;
        const cy = py - height / 2;
        const hx = Math.max(0, width / 2 - radius);
        const hy = Math.max(0, height / 2 - radius);
        const qx = Math.abs(cx) - hx;
        const qy = Math.abs(cy) - hy;
        const inner = Math.min(Math.max(qx, qy), 0);
        const outer = Math.hypot(Math.max(qx, 0), Math.max(qy, 0));
        return inner + outer - radius;
      }
      function createDisplacementPixels(width, height, radius, profile) {
        const magnify = 1;
        const bend = .06;
        const spread = .58;
        const bezelRatio = .62;
        const bezel = clamp(Math.min(width, height) * .5 * bezelRatio, 10, 220);
        const cx = width / 2;
        const cy = height / 2;
        const raw = new Float32Array(width * height * 2);
        let maximum = 0;
        for (let y = 0; y < height; y += 1) {
          for (let x = 0; x < width; x += 1) {
            const px = x + .5;
            const py = y + .5;
            const distance = roundedRectSdf(px, py, width, height, radius);
            let dx = 0;
            let dy = 0;
            if (distance > -bezel) {
              const pull = smoothStep(-bezel, 0, Math.min(distance, 0));
              const shaped = profileCurve(pull, profile);
              const ox = (px - cx) / (width / 2);
              const oy = (py - cy) / (height / 2);
              dx = -ox * shaped * magnify * bezel;
              dy = -oy * shaped * magnify * bezel;
              dx += Math.sin(((px / width) - .5) * Math.PI) * bend * bezel * shaped;
              dy += Math.sin(((py / height) - .5) * Math.PI) * bend * bezel * shaped;
            }
            const index = (y * width + x) * 2;
            raw[index] = dx;
            raw[index + 1] = dy;
            maximum = Math.max(maximum, Math.abs(dx), Math.abs(dy));
          }
        }
        const range = Math.max(1, maximum * spread);
        const data = new Uint8ClampedArray(width * height * 4);
        let rawIndex = 0;
        for (let y = 0; y < height; y += 1) {
          for (let x = 0; x < width; x += 1) {
            const dx = raw[rawIndex];
            const dy = raw[rawIndex + 1];
            rawIndex += 2;
            const edgeDistance = Math.min(x, y, width - x - 1, height - y - 1);
            const edgeFactor = smoothStep(0, 3, edgeDistance);
            const pixel = (y * width + x) * 4;
            data[pixel] = Math.round(clamp((dx * edgeFactor) / range * .5 + .5, 0, 1) * 255);
            data[pixel + 1] = Math.round(clamp((dy * edgeFactor) / range * .5 + .5, 0, 1) * 255);
            data[pixel + 2] = 0;
            data[pixel + 3] = 255;
          }
        }
        return { data: data, scale: range * 2 };
      }
      function cachedMap(width, height, radius, profile) {
        const supersample = 2;
        const w = Math.max(160, Math.round(width * supersample));
        const h = Math.max(96, Math.round(height * supersample));
        const r = Math.max(4, Math.round(radius * supersample));
        const key = w + "x" + h + ":" + r + ":" + profile + ":" + supersample;
        if (mapCache.has(key)) return mapCache.get(key);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const context = canvas.getContext("2d");
        if (!context) return null;
        const image = context.createImageData(w, h);
        const result = createDisplacementPixels(w, h, r, profile);
        image.data.set(result.data);
        context.putImageData(image, 0, 0);
        const map = { url: canvas.toDataURL("image/png"), scale: result.scale / supersample };
        mapCache.set(key, map);
        return map;
      }
      function addSvgNode(parent, name, attrs) {
        const node = document.createElementNS("http://www.w3.org/2000/svg", name);
        Object.keys(attrs).forEach(function (key) { node.setAttribute(key, String(attrs[key])); });
        parent.appendChild(node);
        return node;
      }
      function syncSurface(surface, defs) {
        const rect = surface.getBoundingClientRect();
        if (rect.width < 24 || rect.height < 24) return;
        const radius = Number.parseFloat(window.getComputedStyle(surface).borderRadius) || 24;
        const isDock = surface.classList.contains("bottom-dock");
        const profile = isDock ? "thin" : "soft";
        const map = cachedMap(rect.width, rect.height, radius, profile);
        if (!map || !map.url) return;
        const filterId = "lifeos-filter-" + (++filterNumber);
        const filter = addSvgNode(defs, "filter", { id: filterId, "color-interpolation-filters": "sRGB", x: "-35%", y: "-35%", width: "170%", height: "170%" });
        const image = addSvgNode(filter, "feImage", { x: "0", y: "0", width: "100%", height: "100%", preserveAspectRatio: "none", result: "map" });
        image.setAttribute("href", map.url);
        image.setAttributeNS("http://www.w3.org/1999/xlink", "href", map.url);
        const displacement = addSvgNode(filter, "feDisplacementMap", { in: "SourceGraphic", in2: "map", scale: (map.scale * (isDock ? 1.35 : 1.1)).toFixed(2), xChannelSelector: "R", yChannelSelector: "G", result: "displaced" });
        surface.style.backdropFilter = 'url("#' + filterId + '") blur(.3px) saturate(1.12)';
        surface.style.webkitBackdropFilter = 'url("#' + filterId + '") blur(.3px) saturate(1.12)';
        surface.dataset.refraction = "measured";
        surface.dataset.lensScale = (map.scale * (isDock ? 1.35 : 1.1)).toFixed(2);
      }
      function syncGlass() {
        resizeObservers.forEach(function (observer) { observer.disconnect(); });
        resizeObservers = [];
        const defs = root.querySelector("#lifeos-glass-defs");
        if (!defs) return;
        defs.replaceChildren();
        const surfaces = Array.from(root.querySelectorAll(".glass-surface"));
        surfaces.forEach(function (surface) {
          surface.style.removeProperty("backdrop-filter");
          surface.style.removeProperty("-webkit-backdrop-filter");
          delete surface.dataset.refraction;
          delete surface.dataset.lensScale;
        });
        if (!useRefraction || root.dataset.forceFallback === "true") return;
        surfaces.forEach(function (surface) {
          syncSurface(surface, defs);
          if (window.ResizeObserver) {
            const observer = new ResizeObserver(function () { syncSurface(surface, defs); });
            observer.observe(surface);
            resizeObservers.push(observer);
          }
        });
      }
      function applyAppearance() {
        const opacity = clamp(appearance.opacity / 100, .08, .16);
        const radius = clamp(Number(appearance.radius) || 27, 18, 36);
        root.style.setProperty("--lo-glass-alpha", opacity.toFixed(2));
        root.style.setProperty("--lo-radius", radius + "px");
        root.style.setProperty("--lo-wine", appearance.accent);
        root.style.setProperty("--lo-wine-dark", appearance.accent);
        syncGlass();
      }
      function bindTweakControls() {
        if (typeof globalThis.Tweak !== "function") return;
        try {
          const tweak = new globalThis.Tweak({ container: root, onChange: applyAppearance });
          tweak.addSlider(appearance, "opacity", { label: "Прозрачность стекла", min: 8, max: 16, step: 1, unit: "%" });
          tweak.addColorPicker(appearance, "accent", { label: "Бордовый акцент", reference: "--lo-wine" });
          tweak.addSlider(appearance, "radius", { label: "Округлость поверхностей", min: 18, max: 36, step: 1, unit: "px", reference: "--lo-radius" });
        } catch (error) {}
      }
      function handleClick(event) {
        const target = event.target.closest("[data-action]");
        if (!target || !root.contains(target)) return;
        const action = target.dataset.action;
        if (action === "switch-view") setView(target.dataset.view);
        else if (action === "go-home") setView("today");
        else if (action === "edit-food") openFoodSheet(target.dataset.foodId, target);
        else if (action === "add-food") openFoodSheet("new-food", target);
        else if (action === "close-sheet") closeFoodSheet(true);
        else if (action === "save-food") saveFoodEntry();
        else if (action === "start-workout") {
          state.view = "gym";
          state.gymMode = "workout";
          render();
          persistState();
          announce("Открыта тренировка Верх тела A.");
        } else if (action === "open-exercise") {
          state.view = "gym";
          state.gymMode = "exercise";
          state.currentExercise = target.dataset.exerciseId || "bench";
          render();
          persistState();
        } else if (action === "back-to-workout") {
          state.gymMode = "workout";
          render();
          persistState();
        } else if (action === "complete-set") completeSet();
        else if (action === "toggle-rest") toggleRest();
        else if (action === "end-workout") {
          state.gymMode = "overview";
          render();
          persistState();
          announce("Тренировка сохранена.");
        }
      }
      root.addEventListener("click", handleClick);
      root.addEventListener("input", function (event) {
        if (event.target.id === "edit-food-grams") updateFoodPreview();
      });
      root.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !root.querySelector("#food-sheet").hidden) closeFoodSheet(true);
        if (event.key === "Tab" && !root.querySelector("#food-sheet").hidden) {
          const controls = root.querySelectorAll('#food-sheet button, #food-sheet input');
          const first = controls[0], last = controls[controls.length - 1];
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
          else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        }
      });
      window.addEventListener("openai:set_globals", function (event) {
          const saved = event.detail && event.detail.globals ? event.detail.globals.widgetState : null;
          if (!saved || !saved.privateContent) return;
          const current = { view: state.view, foods: state.foods, logs: state.logs, gymMode: state.gymMode, currentExercise: state.currentExercise };
          if (JSON.stringify(current) === JSON.stringify(saved.privateContent)) return;
          loadSavedState(saved);
          render();
      });
      if (window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
        root.addEventListener("pointermove", function (event) {
          const surface = event.target.closest(".glass-surface[data-lg-interactive]");
          if (!surface) return;
          const rect = surface.getBoundingClientRect();
          const x = clamp((event.clientX - rect.left) / rect.width, 0, 1);
          const y = clamp((event.clientY - rect.top) / rect.height, 0, 1);
          surface.style.setProperty("--lo-light-x", (x * 100).toFixed(1) + "%");
          surface.style.setProperty("--lo-light-y", (y * 100).toFixed(1) + "%");
        });
      }
      root.querySelector("#edit-food-grams").addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          event.preventDefault();
          saveFoodEntry();
        }
      });
      window.addEventListener("pagehide", function () {
        if (restInterval) window.clearInterval(restInterval);
        resizeObservers.forEach(function (observer) { observer.disconnect(); });
        resizeObservers = [];
      });
      applyAppearance();
      bindTweakControls();
      render();
    })();
  </script>
