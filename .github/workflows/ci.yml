name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Схема в src/db/schema.ts и миграции в drizzle/ не должны расходиться: generate не должен создать ничего нового.
      - name: Schema matches migrations
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "Схема расходится с миграциями: выполните npm run db:generate и закоммитьте результат"
            git status --porcelain drizzle
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test of the production build
        timeout-minutes: 3
        run: npm run smoke

  # После зелёных проверок CI сам приводит бейджи и версию в README к package.json
  # и коммитит изменение в ветку PR. Токен по умолчанию не запускает повторный CI;
  # чтобы проверки прошли и на коммите бота, добавьте секрет README_SYNC_TOKEN (PAT).
  sync-readme:
    name: Sync README badges
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.README_SYNC_TOKEN || github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:readme
      - name: Commit README if changed
        run: |
          if git diff --quiet README.md; then
            echo "README уже соответствует package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: sync README badges with package.json"
          git pull --rebase
          git push
