name: Database backup

# Ежедневный зашифрованный дамп всей базы Neon. Репозиторий публичный, поэтому
# открытый дамп нигде не записывается: pg_dump сразу передаётся в age через канал,
# на диск и в лог попадает только шифртекст. Расшифровать может только владелец
# приватного ключа (см. docs/operations.md).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  dump:
    name: Encrypted pg_dump
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Должна быть не ниже мажорной версии Postgres в Neon (сейчас 18).
      PG_MAJOR: "18"
    steps:
      - name: Install pg_dump and age
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends "postgresql-client-${PG_MAJOR}" age
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [ -n "$DATABASE_URL" ] || { echo "Секрет DATABASE_URL не задан"; exit 1; }
          case "$AGE_PUBLIC_KEY" in
            age1*) ;;
            *) echo "Секрет AGE_PUBLIC_KEY не задан или не является публичным ключом age (age1...)"; exit 1 ;;
          esac
          umask 077
          server=$("/usr/lib/postgresql/${PG_MAJOR}/bin/psql" "$DATABASE_URL" -tAc "show server_version_num")
          [ "$((server / 10000))" -le "$PG_MAJOR" ] || { echo "Postgres в Neon новее клиента: сервер $((server / 10000)), PG_MAJOR $PG_MAJOR"; exit 1; }
          # Согласованный снимок обеспечивает сам pg_dump (одна транзакция repeatable read).
          "/usr/lib/postgresql/${PG_MAJOR}/bin/pg_dump" --format=custom --no-owner --no-privileges "$DATABASE_URL" \
            | age -r "$AGE_PUBLIC_KEY" -o lifeos.dump.age
          size=$(stat -c %s lifeos.dump.age)
          [ "$size" -gt 1024 ] || { echo "Дамп подозрительно мал ($size байт)"; exit 1; }
          echo "Зашифрованный дамп: $size байт"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lifeos-db-${{ github.run_id }}
          path: lifeos.dump.age
          retention-days: 14
          if-no-files-found: error
